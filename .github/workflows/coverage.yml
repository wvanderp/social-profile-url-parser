name: Coverage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          standalone: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
